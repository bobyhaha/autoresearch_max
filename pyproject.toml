[project]
name = "autoresearch-max"
version = "0.3.0"
description = "A provenance-first, queue-driven autonomous research pipeline"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This tree is a campaign workspace, not an importable library: the tools are scripts
# under tools/ and host/. The manifest previously declared a package "autoresearch" and a
# console entry point "autoresearch.cli:main", neither of which exists here, so the
# metadata described a project that could not be built or installed.
packages = ["tools"]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# Vendored upstream training code and generated run state are not ours to lint.
exclude = ["runs/code", "runs/state", ".venv"]
line-length = 100
target-version = "py310"
